name: thorondor

x-internal: &internal
  restart: unless-stopped
  networks: [internal]

services:
  orchestrator:
    <<: *internal
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SEARXNG_URL: "http://searxng:8080"
      CRAWL4AI_URL: "http://crawl4ai:11235"
      CHUNKER_URL: "http://chunker:8000"
      RERANKER_ENDPOINT: "${RERANKER_ENDPOINT:-http://reranker:80}"
      RERANKER_MODEL: "${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}"
      RERANKER_PATH: "${RERANKER_PATH:-/rerank}"
      RERANKER_HEALTH_PATH: "${RERANKER_HEALTH_PATH:-/health}"
      LLM_ENDPOINT: "${LLM_ENDPOINT:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      MAX_URLS: "${MAX_URLS:-6}"
      CRAWL_CONCURRENCY: "${CRAWL_CONCURRENCY:-4}"
      CRAWL_TIMEOUT_S: "${CRAWL_TIMEOUT_S:-15}"
      DEFAULT_TOKEN_BUDGET: "${DEFAULT_TOKEN_BUDGET:-4000}"
      CACHE_BACKEND: "${CACHE_BACKEND:-memory}"
      DOMAIN_BLOCKLIST: "${DOMAIN_BLOCKLIST:-}"
    depends_on:
      - searxng
      - crawl4ai
      - chunker

  chunker:
    <<: *internal
    build:
      context: ./semantic-chunking-service
      dockerfile: Dockerfile
    environment:
      EMBEDDING_ENDPOINT: "${EMBEDDING_ENDPOINT:-http://embedding:80}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-BAAI/bge-m3}"
      CHUNKER_MAX_SEGMENTS_DP: "${CHUNKER_MAX_SEGMENTS_DP:-10000}"
      REWARD_CACHE_MAX_SIZE: "${REWARD_CACHE_MAX_SIZE:-100000}"

  searxng:
    <<: *internal
    image: searxng/searxng:latest
    volumes:
      - ./searxng:/etc/searxng:ro
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"

  crawl4ai:
    <<: *internal
    image: unclecode/crawl4ai:latest
    shm_size: "1g"

  embedding:
    <<: *internal
    profiles: ["bundled-models"]
    image: ghcr.io/huggingface/text-embeddings-inference:latest
    command: ["--model-id", "BAAI/bge-m3"]

  reranker:
    <<: *internal
    profiles: ["bundled-models"]
    image: ghcr.io/huggingface/text-embeddings-inference:latest
    command: ["--model-id", "BAAI/bge-reranker-v2-m3"]

networks:
  internal: {}
