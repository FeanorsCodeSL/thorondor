name: thorondor

x-internal: &internal
  restart: unless-stopped
  networks: [internal]

services:
  egress-proxy:
    restart: unless-stopped
    build:
      context: ./ssrf-proxy
      dockerfile: Dockerfile
    networks: [internal, egress]
    environment:
      PROXY_LOG_LEVEL: "${PROXY_LOG_LEVEL}"
      PROXY_HOST: "${PROXY_HOST}"
      PROXY_PORT: "${PROXY_PORT}"
      PROXY_MAX_HEADER_BYTES: "${PROXY_MAX_HEADER_BYTES}"
      PROXY_READ_CHUNK_BYTES: "${PROXY_READ_CHUNK_BYTES}"
      PROXY_RELAY_CHUNK_BYTES: "${PROXY_RELAY_CHUNK_BYTES}"
      PROXY_BLOCKED_IP_CATEGORIES: "${PROXY_BLOCKED_IP_CATEGORIES}"
      PROXY_BLOCKED_SPECIAL_IPS: "${PROXY_BLOCKED_SPECIAL_IPS}"
      PROXY_NAT64_NETWORKS: "${PROXY_NAT64_NETWORKS}"
      PROXY_SIX_TO_FOUR_NETWORKS: "${PROXY_SIX_TO_FOUR_NETWORKS}"
      PROXY_IPV4_COMPAT_NETWORKS: "${PROXY_IPV4_COMPAT_NETWORKS}"

  orchestrator:
    <<: *internal
    init: true
    networks: [internal, egress, crawl-control]
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports:
      - "${ORCHESTRATOR_HOST}:${ORCHESTRATOR_PORT}:8080"
    environment:
      LOG_LEVEL: "${LOG_LEVEL}"
      SEARXNG_URL: "${SEARXNG_URL}"
      CRAWL4AI_URL: "${CRAWL4AI_URL}"
      CHUNKER_URL: "${CHUNKER_URL}"
      RERANKER_ENDPOINT: "${RERANKER_ENDPOINT}"
      RERANKER_MODEL: "${RERANKER_MODEL}"
      RERANKER_PATH: "${RERANKER_PATH}"
      RERANKER_HEALTH_PATH: "${RERANKER_HEALTH_PATH}"
      RERANKER_BATCH_SIZE: "${RERANKER_BATCH_SIZE}"
      RERANKER_TIMEOUT_S: "${RERANKER_TIMEOUT_S}"
      LLM_ENDPOINT: "${LLM_ENDPOINT?}"
      LLM_MODEL: "${LLM_MODEL?}"
      MAX_URLS: "${MAX_URLS}"
      CRAWL_CONCURRENCY: "${CRAWL_CONCURRENCY}"
      CRAWL_TIMEOUT_S: "${CRAWL_TIMEOUT_S}"
      CRAWL_PER_HOST_CONCURRENCY: "${CRAWL_PER_HOST_CONCURRENCY}"
      CRAWL_RESPECT_ROBOTS_TXT: "${CRAWL_RESPECT_ROBOTS_TXT}"
      CRAWLER_USER_AGENT: "${CRAWLER_USER_AGENT}"
      CRAWLER_ROBOTS_USER_AGENT: "${CRAWLER_ROBOTS_USER_AGENT}"
      DEFAULT_TOKEN_BUDGET: "${DEFAULT_TOKEN_BUDGET}"
      RELEVANCE_SCORE_FLOOR: "${RELEVANCE_SCORE_FLOOR}"
      EVIDENCE_QUALITY_ENABLED: "${EVIDENCE_QUALITY_ENABLED}"
      DOMAIN_BLOCKLIST: "${DOMAIN_BLOCKLIST?}"
      DOMAIN_ALLOWLIST: "${DOMAIN_ALLOWLIST?}"
      ALLOWLIST_ONLY: "${ALLOWLIST_ONLY}"
      SEARXNG_API_KEY: "${SEARXNG_API_KEY?}"
      CRAWL4AI_API_KEY: "${CRAWL4AI_API_KEY?}"
      CHUNKER_API_KEY: "${CHUNKER_API_KEY?}"
      RERANKER_API_KEY: "${RERANKER_API_KEY?}"
      LLM_API_KEY: "${LLM_API_KEY?}"
      HEALTHCHECK_TIMEOUT_S: "${HEALTHCHECK_TIMEOUT_S}"
      HEALTHCHECK_MAX_CONNECTIONS: "${HEALTHCHECK_MAX_CONNECTIONS}"
      HEALTHCHECK_MAX_KEEPALIVE_CONNECTIONS: "${HEALTHCHECK_MAX_KEEPALIVE_CONNECTIONS}"
      MARKDOWN_EXTRACTOR: "${MARKDOWN_EXTRACTOR}"
      MARKDOWN_EXTRACTOR_FAVOR_RECALL: "${MARKDOWN_EXTRACTOR_FAVOR_RECALL}"
      MARKDOWN_EXTRACTOR_INCLUDE_COMMENTS: "${MARKDOWN_EXTRACTOR_INCLUDE_COMMENTS}"
      MARKDOWN_EXTRACTOR_INCLUDE_TABLES: "${MARKDOWN_EXTRACTOR_INCLUDE_TABLES}"
      MARKDOWN_EXTRACTOR_DEDUPLICATE: "${MARKDOWN_EXTRACTOR_DEDUPLICATE}"
      MAX_SUBQUERIES: "${MAX_SUBQUERIES}"
      MAX_REQUEST_BODY_BYTES: "${MAX_REQUEST_BODY_BYTES}"
      MAX_RESPONSE_BODY_BYTES: "${MAX_RESPONSE_BODY_BYTES}"
      SEARCH_ROUTE_DEADLINE_S: "${SEARCH_ROUTE_DEADLINE_S}"
      FETCH_ROUTE_DEADLINE_S: "${FETCH_ROUTE_DEADLINE_S}"
      MAP_ROUTE_DEADLINE_S: "${MAP_ROUTE_DEADLINE_S}"
      SITE_CRAWL_ROUTE_DEADLINE_S: "${SITE_CRAWL_ROUTE_DEADLINE_S}"
      DISCOVERY_TIMEOUT_S: "${DISCOVERY_TIMEOUT_S}"
      CHUNK_TIMEOUT_S: "${CHUNK_TIMEOUT_S}"
      MAX_INFLIGHT_SEARCHES: "${MAX_INFLIGHT_SEARCHES}"
      MAX_INFLIGHT_FETCHES: "${MAX_INFLIGHT_FETCHES}"
      MAX_INFLIGHT_MAPS: "${MAX_INFLIGHT_MAPS}"
      MAX_INFLIGHT_CRAWLS: "${MAX_INFLIGHT_CRAWLS}"
      ADMISSION_WAIT_S: "${ADMISSION_WAIT_S}"
      ADMISSION_RETRY_AFTER_S: "${ADMISSION_RETRY_AFTER_S}"
      MAX_INTERNAL_FANOUT: "${MAX_INTERNAL_FANOUT}"
      MAX_CONTENT_BYTES: "${MAX_CONTENT_BYTES}"
      CHUNK_CONCURRENCY: "${CHUNK_CONCURRENCY}"
      SITE_DEFAULT_DELAY_S: "${SITE_DEFAULT_DELAY_S}"
      SITE_MAX_JITTER_S: "${SITE_MAX_JITTER_S}"
      SITE_MAX_COOLDOWN_S: "${SITE_MAX_COOLDOWN_S}"
      ROBOTS_CACHE_TTL_S: "${ROBOTS_CACHE_TTL_S}"
      MAX_ROBOTS_BYTES: "${MAX_ROBOTS_BYTES}"
      MAX_SITEMAP_BYTES: "${MAX_SITEMAP_BYTES}"
      MAX_SITEMAP_ENTRIES: "${MAX_SITEMAP_ENTRIES}"
      MAX_SITEMAP_DOCUMENTS: "${MAX_SITEMAP_DOCUMENTS}"
      PAGE_CACHE_ENABLED: "${PAGE_CACHE_ENABLED}"
      PAGE_CACHE_PATH: "${PAGE_CACHE_PATH}"
      PAGE_CACHE_TTL_S: "${PAGE_CACHE_TTL_S}"
      PAGE_CACHE_STALE_S: "${PAGE_CACHE_STALE_S}"
      PAGE_CACHE_RETENTION_S: "${PAGE_CACHE_RETENTION_S}"
      PAGE_CACHE_RAW_HTML_ENABLED: "${PAGE_CACHE_RAW_HTML_ENABLED}"
      PAGE_DIFF_MAX_INPUT_LINES: "${PAGE_DIFF_MAX_INPUT_LINES}"
      PAGE_DIFF_MAX_OPERATIONS: "${PAGE_DIFF_MAX_OPERATIONS}"
      PAGE_DIFF_MAX_OUTPUT_LINES: "${PAGE_DIFF_MAX_OUTPUT_LINES}"
      CRAWL_JOBS_ENABLED: "${CRAWL_JOBS_ENABLED}"
      CRAWL_JOB_PATH: "${CRAWL_JOB_PATH}"
      CRAWL_SYNC_MAX_PAGES: "${CRAWL_SYNC_MAX_PAGES}"
      CRAWL_JOB_RETENTION_S: "${CRAWL_JOB_RETENTION_S}"
      CRAWL_JOB_EXPIRED_TOMBSTONE_S: "${CRAWL_JOB_EXPIRED_TOMBSTONE_S}"
      CRAWL_JOB_MAX_ATTEMPTS: "${CRAWL_JOB_MAX_ATTEMPTS}"
      CRAWL_JOB_RETRY_BASE_S: "${CRAWL_JOB_RETRY_BASE_S}"
      CRAWL_JOB_ATTEMPT_DEADLINE_S: "${CRAWL_JOB_ATTEMPT_DEADLINE_S}"
      CRAWL_JOB_MAX_RECORDS: "${CRAWL_JOB_MAX_RECORDS}"
      CRAWL_JOB_RAW_HTML_ENABLED: "${CRAWL_JOB_RAW_HTML_ENABLED}"
      CRAWL_JOB_MAX_INFLIGHT_REQUESTS: "${CRAWL_JOB_MAX_INFLIGHT_REQUESTS}"
      CRAWL_JOB_RESULT_PAGE_MAX_ITEMS: "${CRAWL_JOB_RESULT_PAGE_MAX_ITEMS}"
      CRAWL_JOB_RESULT_PAGE_MAX_BYTES: "${CRAWL_JOB_RESULT_PAGE_MAX_BYTES}"
      SEARCH_PROFILE_QUICK_TOKEN_BUDGET: "${SEARCH_PROFILE_QUICK_TOKEN_BUDGET}"
      SEARCH_PROFILE_QUICK_MAX_URLS: "${SEARCH_PROFILE_QUICK_MAX_URLS}"
      SEARCH_PROFILE_QUICK_MAX_PASSAGES: "${SEARCH_PROFILE_QUICK_MAX_PASSAGES}"
      SEARCH_PROFILE_RESEARCH_TOKEN_BUDGET: "${SEARCH_PROFILE_RESEARCH_TOKEN_BUDGET}"
      SEARCH_PROFILE_RESEARCH_MAX_URLS: "${SEARCH_PROFILE_RESEARCH_MAX_URLS}"
      SEARCH_PROFILE_RESEARCH_MAX_PASSAGES: "${SEARCH_PROFILE_RESEARCH_MAX_PASSAGES}"
      SEARCH_PROFILE_DEEP_TOKEN_BUDGET: "${SEARCH_PROFILE_DEEP_TOKEN_BUDGET}"
      SEARCH_PROFILE_DEEP_MAX_URLS: "${SEARCH_PROFILE_DEEP_MAX_URLS}"
      SEARCH_PROFILE_DEEP_MAX_PASSAGES: "${SEARCH_PROFILE_DEEP_MAX_PASSAGES}"
      URL_SAFETY_BLOCKED_IP_CATEGORIES: "${URL_SAFETY_BLOCKED_IP_CATEGORIES}"
      URL_SAFETY_BLOCKED_SPECIAL_IPS: "${URL_SAFETY_BLOCKED_SPECIAL_IPS}"
      URL_SAFETY_NAT64_NETWORKS: "${URL_SAFETY_NAT64_NETWORKS}"
      URL_SAFETY_SIX_TO_FOUR_NETWORKS: "${URL_SAFETY_SIX_TO_FOUR_NETWORKS}"
      URL_SAFETY_IPV4_COMPAT_NETWORKS: "${URL_SAFETY_IPV4_COMPAT_NETWORKS}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS}"
      MCP_ALLOWED_ORIGINS: "${MCP_ALLOWED_ORIGINS}"
    volumes:
      - thorondor-page-cache:/var/lib/thorondor
    depends_on:
      - searxng
      - crawl4ai
      - chunker

  chunker:
    <<: *internal
    init: true
    build:
      context: ./semantic-chunking-service
      dockerfile: Dockerfile
    mem_limit: "${CHUNKER_MEM_LIMIT}"
    environment:
      LOG_LEVEL: "${CHUNKER_LOG_LEVEL}"
      CHUNKER_DEFAULT_STRATEGY_VERSION: "${CHUNKER_DEFAULT_STRATEGY_VERSION}"
      EMBEDDING_ENDPOINT: "${EMBEDDING_ENDPOINT}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY?}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE}"
      EMBEDDING_TIMEOUT_S: "${EMBEDDING_TIMEOUT_S}"
      CHUNKER_MAX_SEGMENTS_DP: "${CHUNKER_MAX_SEGMENTS_DP}"
      REWARD_CACHE_MAX_SIZE: "${REWARD_CACHE_MAX_SIZE}"

  searxng:
    <<: *internal
    image: searxng/searxng@sha256:f4c8e59de166ed71f6380c0847c312ca51f0d41996e31d0559163b6b09ecde52
    networks: [internal, egress]
    volumes:
      - ./searxng:/etc/searxng
    environment:
      SEARXNG_BASE_URL: "${SEARXNG_BASE_URL}"
      SEARXNG_SECRET: "${SEARXNG_SECRET}"

  crawl4ai:
    <<: *internal
    networks:
      crawl-control:
      crawl-egress:
        gw_priority: 1
    # Public upstream self-hosted Docker API. Keep this as an image dependency
    # and integrate over HTTP; do not vendor or build Crawl4AI in this repo.
    image: unclecode/crawl4ai@sha256:bd36741e7bdd35ddc1a05d9183e1d6d8cefb61dd640d944a25d026b76e917690
    environment:
      CRAWL4AI_API_TOKEN: "${CRAWL4AI_API_KEY?}"
      CRAWL4AI_ALLOW_INTERNAL_URLS: "${CRAWL4AI_ALLOW_INTERNAL_URLS}"
    user: "appuser"
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/redis:uid=999,gid=999,mode=0700
      - /var/lib/crawl4ai/outputs:uid=999,gid=999,mode=0700
      - /home/appuser/.crawl4ai:uid=999,gid=999,mode=0700
      - /home/appuser/.cache/url_seeder:uid=999,gid=999,mode=0700
      - /home/appuser/.gunicorn:uid=999,gid=999,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    shm_size: "1g"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  embedding:
    <<: *internal
    profiles: ["bundled-models"]
    image: ghcr.io/huggingface/text-embeddings-inference@sha256:af92a3852c965393cbdd111865c3a72445d2b430c7daf84269ffdb5cf178f4eb
    networks: [internal, egress]
    command: ["--model-id", "${EMBEDDING_MODEL}", "--revision", "${EMBEDDING_MODEL_REVISION}"]

  reranker:
    <<: *internal
    profiles: ["bundled-models"]
    image: ghcr.io/huggingface/text-embeddings-inference@sha256:af92a3852c965393cbdd111865c3a72445d2b430c7daf84269ffdb5cf178f4eb
    networks: [internal, egress]
    command: ["--model-id", "${RERANKER_MODEL}", "--revision", "${RERANKER_MODEL_REVISION}"]

networks:
  internal:
    internal: true
  egress: {}
  crawl-control:
    internal: true
  crawl-egress: {}

volumes:
  thorondor-page-cache: {}
