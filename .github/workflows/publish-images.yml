name: publish-images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish, without the leading v"
        required: true
        default: "0.1.0"
      create_release:
        description: "Create or update a GitHub release with image digests"
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: feanorscodesl

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            orchestrator/requirements*.txt
            semantic-chunking-service/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install \
            -r orchestrator/requirements.txt \
            -r orchestrator/requirements-dev.txt \
            -r semantic-chunking-service/requirements.txt \
            -r semantic-chunking-service/requirements-dev.txt
      - name: Check release guard
        run: bash scripts/check-release-guard.sh
      - name: Compile Python sources
        run: python -m compileall orchestrator semantic-chunking-service ssrf-proxy thorondor_cli -q
      - name: Run offline tests
        run: python -m pytest semantic-chunking-service/tests orchestrator/tests thorondor_cli/tests -v
      - name: Validate production Compose config
        run: |
          docker compose \
            --env-file .env.example \
            --env-file .env.production.example \
            -f docker-compose.production.yml \
            config >/dev/null

  images:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: thorondor-orchestrator
            context: .
            dockerfile: orchestrator/Dockerfile
          - name: thorondor-chunker
            context: semantic-chunking-service
            dockerfile: semantic-chunking-service/Dockerfile
          - name: thorondor-egress-proxy
            context: ssrf-proxy
            dockerfile: ssrf-proxy/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=git-
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
      - name: Write image digest file
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mkdir -p image-digests
          {
            echo "${IMAGE_REF}@${IMAGE_DIGEST}"
            echo "image=${IMAGE_REF}"
            echo "digest=${IMAGE_DIGEST}"
            echo "tags:"
            echo "${IMAGE_TAGS}"
          } > "image-digests/${{ matrix.image.name }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.image.name }}
          path: image-digests/${{ matrix.image.name }}.txt

  release:
    runs-on: ubuntu-latest
    needs: images
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.create_release) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: image-digests
          merge-multiple: true
      - name: Resolve release tag
        id: release_tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            raw="${{ inputs.image_tag }}"
            raw="${raw#v}"
            echo "value=v${raw}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build release digest manifest
        run: |
          {
            echo "# Thorondor image digests"
            echo
            for file in image-digests/*.txt; do
              echo "## $(basename "$file" .txt)"
              cat "$file"
              echo
            done
          } > THORONDOR_IMAGE_DIGESTS.md
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" THORONDOR_IMAGE_DIGESTS.md --clobber
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            gh release create "$RELEASE_TAG" THORONDOR_IMAGE_DIGESTS.md \
              --title "Thorondor ${RELEASE_TAG}" \
              --notes-file THORONDOR_IMAGE_DIGESTS.md \
              --target "$GITHUB_SHA"
          else
            gh release create "$RELEASE_TAG" THORONDOR_IMAGE_DIGESTS.md \
              --title "Thorondor ${RELEASE_TAG}" \
              --notes-file THORONDOR_IMAGE_DIGESTS.md
          fi
