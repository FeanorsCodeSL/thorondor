name: release-guard

on:
  pull_request:
  push:

jobs:
  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Check pinned runtime images and SearXNG boundary
        run: bash scripts/check-release-guard.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            orchestrator/requirements*.txt
            orchestrator/requirements*.lock
            semantic-chunking-service/requirements*.txt
            semantic-chunking-service/requirements*.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install \
            -r orchestrator/requirements-dev.lock \
            -r semantic-chunking-service/requirements-dev.lock
      - name: Compile Python sources
        run: python -m compileall orchestrator semantic-chunking-service ssrf-proxy thorondor_cli -q
      - name: Run offline tests
        run: python -m pytest semantic-chunking-service/tests orchestrator/tests thorondor_cli/tests -v
      - name: Validate bundled Compose config
        run: docker compose --env-file .env.example -f docker-compose.yml --profile bundled-models config >/dev/null
      - name: Validate llama.cpp Compose config
        run: |
          docker compose \
            --env-file .env.example \
            --env-file .env.llamacpp.example \
            -f docker-compose.yml \
            -f docker-compose.llamacpp.yml \
            --profile llamacpp-models \
            config >/dev/null
      - name: Validate production Compose config
        run: |
          docker compose \
            --env-file .env.example \
            --env-file .env.production.example \
            -f docker-compose.production.yml \
            config >/dev/null

  mcp-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            orchestrator/requirements*.txt
            orchestrator/requirements*.lock
            semantic-chunking-service/requirements*.txt
            semantic-chunking-service/requirements*.lock
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: tools/mcp-conformance/.nvmrc
          cache: npm
          cache-dependency-path: tools/mcp-conformance/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install \
            -r orchestrator/requirements-dev.lock \
            -r semantic-chunking-service/requirements-dev.lock
      - name: Install pinned conformance runner
        run: npm ci --prefix tools/mcp-conformance --ignore-scripts
      - name: Run selected MCP conformance profile
        run: python scripts/run-mcp-conformance.py --output-dir "$RUNNER_TEMP/thorondor-mcp-conformance"
      - name: Upload MCP conformance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: thorondor-mcp-conformance
          path: ${{ runner.temp }}/thorondor-mcp-conformance
