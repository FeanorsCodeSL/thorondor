name: thorondor

services:
  orchestrator:
    environment:
      RERANKER_ENDPOINT: "http://reranker:8080"
      RERANKER_MODEL: "${LLAMACPP_RERANKER_ALIAS:-bge-reranker-v2-m3}"
      RERANKER_PATH: "/reranking"
      RERANKER_HEALTH_PATH: "/health"

  chunker:
    environment:
      EMBEDDING_ENDPOINT: "http://embedding:8080"
      EMBEDDING_MODEL: "${LLAMACPP_EMBEDDING_ALIAS:-bge-m3}"

  embedding:
    profiles: ["llamacpp-models"]
    image: "${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}"
    volumes:
      - ./models:/models:ro
    command:
      - "-m"
      - "${LLAMACPP_EMBEDDING_MODEL:-/models/bge-m3.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--embedding"
      - "--pooling"
      - "${LLAMACPP_EMBEDDING_POOLING:-cls}"
      - "-ub"
      - "${LLAMACPP_UBATCH:-8192}"
      - "-c"
      - "${LLAMACPP_EMBEDDING_CONTEXT:-8192}"

  reranker:
    profiles: ["llamacpp-models"]
    image: "${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}"
    volumes:
      - ./models:/models:ro
    command:
      - "-m"
      - "${LLAMACPP_RERANKER_MODEL:-/models/bge-reranker-v2-m3.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--embedding"
      - "--pooling"
      - "rank"
      - "--reranking"
      - "-c"
      - "${LLAMACPP_RERANKER_CONTEXT:-8192}"
