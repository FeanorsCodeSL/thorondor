name: thorondor

x-internal: &internal
  restart: unless-stopped
  networks: [internal]

services:
  egress-proxy:
    restart: unless-stopped
    image: "${THORONDOR_EGRESS_PROXY_IMAGE}"
    networks: [internal, egress]
    environment:
      PROXY_LOG_LEVEL: "${PROXY_LOG_LEVEL}"
      PROXY_HOST: "${PROXY_HOST}"
      PROXY_PORT: "${PROXY_PORT}"
      PROXY_MAX_HEADER_BYTES: "${PROXY_MAX_HEADER_BYTES}"
      PROXY_READ_CHUNK_BYTES: "${PROXY_READ_CHUNK_BYTES}"
      PROXY_RELAY_CHUNK_BYTES: "${PROXY_RELAY_CHUNK_BYTES}"
      PROXY_BLOCKED_IP_CATEGORIES: "${PROXY_BLOCKED_IP_CATEGORIES}"
      PROXY_BLOCKED_SPECIAL_IPS: "${PROXY_BLOCKED_SPECIAL_IPS}"
      PROXY_NAT64_NETWORKS: "${PROXY_NAT64_NETWORKS}"
      PROXY_SIX_TO_FOUR_NETWORKS: "${PROXY_SIX_TO_FOUR_NETWORKS}"
      PROXY_IPV4_COMPAT_NETWORKS: "${PROXY_IPV4_COMPAT_NETWORKS}"

  orchestrator:
    <<: *internal
    networks: [internal, egress]
    image: "${THORONDOR_ORCHESTRATOR_IMAGE}"
    ports:
      - "${ORCHESTRATOR_HOST}:${ORCHESTRATOR_PORT}:8080"
    environment:
      LOG_LEVEL: "${LOG_LEVEL}"
      SEARXNG_URL: "${SEARXNG_URL}"
      CRAWL4AI_URL: "${CRAWL4AI_URL}"
      CHUNKER_URL: "${CHUNKER_URL}"
      RERANKER_ENDPOINT: "${RERANKER_ENDPOINT}"
      RERANKER_MODEL: "${RERANKER_MODEL}"
      RERANKER_PATH: "${RERANKER_PATH}"
      RERANKER_HEALTH_PATH: "${RERANKER_HEALTH_PATH}"
      RERANKER_BATCH_SIZE: "${RERANKER_BATCH_SIZE}"
      RERANKER_TIMEOUT_S: "${RERANKER_TIMEOUT_S}"
      LLM_ENDPOINT: "${LLM_ENDPOINT?}"
      LLM_MODEL: "${LLM_MODEL?}"
      MAX_URLS: "${MAX_URLS}"
      CRAWL_CONCURRENCY: "${CRAWL_CONCURRENCY}"
      CRAWL_TIMEOUT_S: "${CRAWL_TIMEOUT_S}"
      CRAWL_PER_HOST_CONCURRENCY: "${CRAWL_PER_HOST_CONCURRENCY}"
      CRAWL_RESPECT_ROBOTS_TXT: "${CRAWL_RESPECT_ROBOTS_TXT}"
      CRAWL_VALIDATE_REDIRECTS: "${CRAWL_VALIDATE_REDIRECTS}"
      CRAWL_MAX_PREFLIGHT_REDIRECTS: "${CRAWL_MAX_PREFLIGHT_REDIRECTS}"
      DEFAULT_TOKEN_BUDGET: "${DEFAULT_TOKEN_BUDGET}"
      RELEVANCE_SCORE_FLOOR: "${RELEVANCE_SCORE_FLOOR}"
      DOMAIN_BLOCKLIST: "${DOMAIN_BLOCKLIST?}"
      DOMAIN_ALLOWLIST: "${DOMAIN_ALLOWLIST?}"
      ALLOWLIST_ONLY: "${ALLOWLIST_ONLY}"
      SEARXNG_API_KEY: "${SEARXNG_API_KEY?}"
      CRAWL4AI_API_KEY: "${CRAWL4AI_API_KEY?}"
      CHUNKER_API_KEY: "${CHUNKER_API_KEY?}"
      RERANKER_API_KEY: "${RERANKER_API_KEY?}"
      LLM_API_KEY: "${LLM_API_KEY?}"
      HEALTHCHECK_TIMEOUT_S: "${HEALTHCHECK_TIMEOUT_S}"
      HEALTHCHECK_MAX_CONNECTIONS: "${HEALTHCHECK_MAX_CONNECTIONS}"
      HEALTHCHECK_MAX_KEEPALIVE_CONNECTIONS: "${HEALTHCHECK_MAX_KEEPALIVE_CONNECTIONS}"
      MARKDOWN_EXTRACTOR: "${MARKDOWN_EXTRACTOR}"
      MARKDOWN_EXTRACTOR_FAVOR_RECALL: "${MARKDOWN_EXTRACTOR_FAVOR_RECALL}"
      MARKDOWN_EXTRACTOR_INCLUDE_COMMENTS: "${MARKDOWN_EXTRACTOR_INCLUDE_COMMENTS}"
      MARKDOWN_EXTRACTOR_INCLUDE_TABLES: "${MARKDOWN_EXTRACTOR_INCLUDE_TABLES}"
      MARKDOWN_EXTRACTOR_DEDUPLICATE: "${MARKDOWN_EXTRACTOR_DEDUPLICATE}"
      MAX_SUBQUERIES: "${MAX_SUBQUERIES}"
      SEARCH_PROFILE_QUICK_TOKEN_BUDGET: "${SEARCH_PROFILE_QUICK_TOKEN_BUDGET}"
      SEARCH_PROFILE_QUICK_MAX_URLS: "${SEARCH_PROFILE_QUICK_MAX_URLS}"
      SEARCH_PROFILE_QUICK_MAX_PASSAGES: "${SEARCH_PROFILE_QUICK_MAX_PASSAGES}"
      SEARCH_PROFILE_RESEARCH_TOKEN_BUDGET: "${SEARCH_PROFILE_RESEARCH_TOKEN_BUDGET}"
      SEARCH_PROFILE_RESEARCH_MAX_URLS: "${SEARCH_PROFILE_RESEARCH_MAX_URLS}"
      SEARCH_PROFILE_RESEARCH_MAX_PASSAGES: "${SEARCH_PROFILE_RESEARCH_MAX_PASSAGES}"
      SEARCH_PROFILE_DEEP_TOKEN_BUDGET: "${SEARCH_PROFILE_DEEP_TOKEN_BUDGET}"
      SEARCH_PROFILE_DEEP_MAX_URLS: "${SEARCH_PROFILE_DEEP_MAX_URLS}"
      SEARCH_PROFILE_DEEP_MAX_PASSAGES: "${SEARCH_PROFILE_DEEP_MAX_PASSAGES}"
      URL_SAFETY_BLOCKED_IP_CATEGORIES: "${URL_SAFETY_BLOCKED_IP_CATEGORIES}"
      URL_SAFETY_BLOCKED_SPECIAL_IPS: "${URL_SAFETY_BLOCKED_SPECIAL_IPS}"
      URL_SAFETY_NAT64_NETWORKS: "${URL_SAFETY_NAT64_NETWORKS}"
      URL_SAFETY_SIX_TO_FOUR_NETWORKS: "${URL_SAFETY_SIX_TO_FOUR_NETWORKS}"
      URL_SAFETY_IPV4_COMPAT_NETWORKS: "${URL_SAFETY_IPV4_COMPAT_NETWORKS}"
    depends_on:
      - searxng
      - crawl4ai
      - chunker

  chunker:
    <<: *internal
    image: "${THORONDOR_CHUNKER_IMAGE}"
    mem_limit: "${CHUNKER_MEM_LIMIT}"
    environment:
      LOG_LEVEL: "${CHUNKER_LOG_LEVEL}"
      CHUNKER_DEFAULT_STRATEGY_VERSION: "${CHUNKER_DEFAULT_STRATEGY_VERSION}"
      EMBEDDING_ENDPOINT: "${EMBEDDING_ENDPOINT}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY?}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE}"
      EMBEDDING_TIMEOUT_S: "${EMBEDDING_TIMEOUT_S}"
      CHUNKER_MAX_SEGMENTS_DP: "${CHUNKER_MAX_SEGMENTS_DP}"
      REWARD_CACHE_MAX_SIZE: "${REWARD_CACHE_MAX_SIZE}"

  searxng:
    <<: *internal
    image: "${THORONDOR_SEARXNG_IMAGE}"
    networks: [internal, egress]
    volumes:
      - "${THORONDOR_SEARXNG_CONFIG_DIR}:/etc/searxng:ro"
    environment:
      SEARXNG_BASE_URL: "${SEARXNG_BASE_URL}"
      SEARXNG_SECRET: "${SEARXNG_SECRET}"

  crawl4ai:
    <<: *internal
    networks: [internal, egress]
    image: "${THORONDOR_CRAWL4AI_IMAGE}"
    environment:
      CRAWL4AI_API_TOKEN: "${CRAWL4AI_API_KEY?}"
      HTTP_PROXY: "${CRAWL4AI_HTTP_PROXY}"
      HTTPS_PROXY: "${CRAWL4AI_HTTPS_PROXY}"
      ALL_PROXY: "${CRAWL4AI_ALL_PROXY}"
      http_proxy: "${CRAWL4AI_HTTP_PROXY}"
      https_proxy: "${CRAWL4AI_HTTPS_PROXY}"
      all_proxy: "${CRAWL4AI_ALL_PROXY}"
      NO_PROXY: "${CRAWL4AI_NO_PROXY?}"
      no_proxy: "${CRAWL4AI_NO_PROXY?}"
    shm_size: "1g"
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          redis-cli ping > /dev/null &&
          NO_PROXY=localhost,127.0.0.1,::1
          no_proxy=localhost,127.0.0.1,::1
          curl -f http://localhost:11235/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    depends_on:
      - egress-proxy

  embedding:
    <<: *internal
    profiles: ["bundled-models"]
    image: "${THORONDOR_TEI_IMAGE}"
    networks: [internal, egress]
    command: ["--model-id", "${EMBEDDING_MODEL}"]

  reranker:
    <<: *internal
    profiles: ["bundled-models"]
    image: "${THORONDOR_TEI_IMAGE}"
    networks: [internal, egress]
    command: ["--model-id", "${RERANKER_MODEL}"]

networks:
  internal:
    internal: true
  egress: {}
