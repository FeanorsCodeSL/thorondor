sonar.projectKey=thorondor
sonar.projectName=Thorondor
sonar.projectDescription=Self-hosted semantic web search service for agent workflows.
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

sonar.sources=orchestrator,semantic-chunking-service/chunking,ssrf-proxy,scripts
sonar.tests=orchestrator/tests,semantic-chunking-service/tests

sonar.exclusions=**/__pycache__/**,**/.venv/**,**/.pytest_cache/**,**/.scannerwork/**,models/**,certs/**
sonar.coverage.exclusions=orchestrator/tests/**,semantic-chunking-service/tests/**,scripts/**
sonar.test.inclusions=orchestrator/tests/**/*.py,semantic-chunking-service/tests/**/*.py
sonar.python.coverage.reportPaths=coverage.xml
